name: EAS Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
      submit:
        description: Submit to app stores after build (production only)
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: EAS Build (${{ github.event.inputs.profile || 'production' }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Initialize EAS project (if needed)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if ! grep -q '"projectId"' app.json; then
            npx eas-cli init --non-interactive
          fi

      - name: Build iOS and Android
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          PROFILE="${{ github.event.inputs.profile || 'production' }}"
          npx eas-cli build --platform all --profile "$PROFILE" --non-interactive

      - name: Submit to app stores
        if: (github.event_name == 'release' || github.event.inputs.submit == 'true') && (github.event.inputs.profile == 'production' || github.event_name == 'release')
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli submit --platform all --profile production --non-interactive --latest
